          import struct, zlib
          W = 192
          rows = []
          for y in range(W):
              row = bytearray([0])
              for x in range(W):
                  m = 28
                  if m <= x < W - m and m <= y < W - m:
                      t = (x + y) / (2.0 * W)
                      r = int(138 + (138 - 138) * t); g = int(255 - 15 * t); b = int(255 - 117 * t)
                      row += bytes([r, g, b, 255])
                  else:
                      row += bytes([13, 19, 40, 255])
              rows.append(bytes(row))
          raw = b"".join(rows)
          def chunk(t, d):
              c = struct.pack(">I", len(d)) + t + d
              return c + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", W, W, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
          open("app/src/main/res/mipmap-xxxhdpi/ic_launcher.png", "wb").write(png)
