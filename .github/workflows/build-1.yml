name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project (WebView + AndroidBridge)
        run: |
          set -e
          HTML=$(ls -1 *.html 2>/dev/null | head -n 1)
          if [ -z "$HTML" ]; then
            echo "::error::Положи свой HTML-файл лаунчера в корень репозитория (рядом с папкой .github)"
            exit 1
          fi
          echo "Использую: $HTML"
          rm -rf _apkbuild
          mkdir -p _apkbuild
          cd _apkbuild
          mkdir -p .
          cat > settings.gradle <<'__EOF__'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "GamerLauncher"
          include ':app'
          __EOF__
          mkdir -p .
          cat > build.gradle <<'__EOF__'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          __EOF__
          mkdir -p .
          cat > gradle.properties <<'__EOF__'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          __EOF__
          mkdir -p app
          cat > app/build.gradle <<'__EOF__'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gamer.launcher'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.gamer.launcher'
                  minSdk 24
                  targetSdk 34
                  versionCode 63
                  versionName '6.3'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              androidResources {
                  noCompress 'html'
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.12.0'
          }
          __EOF__
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:label="Gamer Launcher"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.gamer.launcher.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          __EOF__
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="apk" path="apk/" />
          </paths>
          __EOF__
          mkdir -p app/src/main/java/com/gamer/launcher
          cat > app/src/main/java/com/gamer/launcher/MainActivity.java <<'__EOF__'
          package com.gamer.launcher;

          import android.Manifest;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ActivityNotFoundException;
          import android.content.ClipData;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.content.pm.ShortcutInfo;
          import android.content.pm.ShortcutManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.Icon;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Message;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.core.content.FileProvider;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends Activity {

              private static final int REQ_FILE = 1001;
              private static final int REQ_PERM = 1002;
              private static final String CHANNEL_ID = "gamer_news";

              private WebView web;
              private ValueCallback<Uri[]> filePathCb;
              private final Handler ui = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }

                  WebView.setWebContentsDebuggingEnabled(true);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF02070F);
                  setContentView(web);
                  hideSystemUi();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setLoadWithOverviewMode(false);
                  s.setUseWideViewPort(false);
                  s.setTextZoom(100);

                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          if (!req.isForMainFrame()) return false;
                          return handleUrl(req.getUrl().toString());
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb,
                                                       FileChooserParams params) {
                          if (filePathCb != null) filePathCb.onReceiveValue(null);
                          filePathCb = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          String type = "*/*";
                          String[] acc = params.getAcceptTypes();
                          if (acc != null && acc.length == 1 && acc[0] != null
                                  && acc[0].startsWith("image/")) {
                              type = acc[0];
                          }
                          i.setType(type);
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE,
                                  params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE);
                          try {
                              startActivityForResult(Intent.createChooser(i, "Select file"), REQ_FILE);
                          } catch (Exception e) {
                              filePathCb = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog,
                                                    boolean isUserGesture, Message resultMsg) {
                          final WebView tmp = new WebView(MainActivity.this);
                          tmp.setWebViewClient(new WebViewClient() {
                              private boolean done = false;

                              private void go(final WebView v, String url) {
                                  if (done || url == null || url.equals("about:blank")) return;
                                  done = true;
                                  handleUrl(url);
                                  ui.post(new Runnable() {
                                      @Override
                                      public void run() {
                                          try { v.stopLoading(); v.destroy(); } catch (Exception ignored) { }
                                      }
                                  });
                              }

                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                                  go(v, r.getUrl().toString());
                                  return true;
                              }

                              @Override
                              public void onPageStarted(WebView v, String url, Bitmap favicon) {
                                  go(v, url);
                              }
                          });
                          WebView.WebViewTransport t = (WebView.WebViewTransport) resultMsg.obj;
                          t.setWebView(tmp);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  web.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String ua, String cd, String mime, long len) {
                          if (url != null && url.startsWith("http")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception ignored) { }
                          }
                      }
                  });

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_PERM);
                  }

                  web.loadUrl("file:///android_asset/index.html");
              }

              private boolean handleUrl(String url) {
                  if (url == null) return true;
                  if (url.startsWith("file:") || url.startsWith("about:")
                          || url.startsWith("data:") || url.startsWith("blob:")
                          || url.startsWith("javascript:")) {
                      return false;
                  }
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (ActivityNotFoundException e) {
                      toast("Не удалось открыть: " + url);
                  } catch (Exception ignored) { }
                  return true;
              }

              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUi();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQ_FILE) return;
                  if (filePathCb == null) return;
                  Uri[] result = null;
                  if (resultCode == RESULT_OK && data != null) {
                      ClipData cd = data.getClipData();
                      if (cd != null && cd.getItemCount() > 0) {
                          result = new Uri[cd.getItemCount()];
                          for (int k = 0; k < cd.getItemCount(); k++) {
                              result[k] = cd.getItemAt(k).getUri();
                          }
                      } else if (data.getData() != null) {
                          result = new Uri[]{data.getData()};
                      }
                  }
                  filePathCb.onReceiveValue(result);
                  filePathCb = null;
              }

              @Override
              public void onBackPressed() {
                  moveTaskToBack(true);
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                  }
                  super.onDestroy();
              }

              private void toast(final String msg) {
                  ui.post(new Runnable() {
                      @Override
                      public void run() {
                          Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show();
                      }
                  });
              }

              private static String safeName(String n) {
                  if (n == null || n.length() == 0) return "file";
                  String r = n.replace("/", "_").replace("\\", "_").replace("..", "_");
                  return r.length() == 0 ? "file" : r;
              }

              private File baseDir() {
                  File d = getExternalFilesDir(null);
                  if (d == null) d = getFilesDir();
                  File g = new File(d, "GamerLauncher");
                  g.mkdirs();
                  return g;
              }

              private static byte[] decodeDataUrl(String s) {
                  if (s == null) return new byte[0];
                  int c = s.indexOf(',');
                  String b = (s.startsWith("data:") && c >= 0) ? s.substring(c + 1) : s;
                  return Base64.decode(b, Base64.DEFAULT);
              }

              private void saveToDownloads(String name, byte[] bytes, String mime) throws Exception {
                  name = safeName(name);
                  if (Build.VERSION.SDK_INT >= 29) {
                      ContentResolver cr = getContentResolver();
                      ContentValues cv = new ContentValues();
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                      cv.put(MediaStore.MediaColumns.RELATIVE_PATH,
                              Environment.DIRECTORY_DOWNLOADS + "/GamerLauncher");
                      Uri u = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                      if (u == null) throw new Exception("insert failed");
                      OutputStream os = cr.openOutputStream(u);
                      try {
                          os.write(bytes);
                      } finally {
                          os.close();
                      }
                  } else {
                      File dir = new File(Environment.getExternalStoragePublicDirectory(
                              Environment.DIRECTORY_DOWNLOADS), "GamerLauncher");
                      dir.mkdirs();
                      FileOutputStream os = new FileOutputStream(new File(dir, name));
                      try {
                          os.write(bytes);
                      } finally {
                          os.close();
                      }
                  }
                  toast("Сохранено в Загрузки/GamerLauncher: " + name);
              }

              /** Streaming file writer used for chunked uploads from JS. */
              private static class Sink {
                  File file;
                  OutputStream os;

                  void open(File f) throws Exception {
                      close();
                      file = f;
                      f.getParentFile().mkdirs();
                      os = new FileOutputStream(f);
                  }

                  void write(String b64) throws Exception {
                      if (os != null) os.write(Base64.decode(b64, Base64.DEFAULT));
                  }

                  void close() {
                      try {
                          if (os != null) os.close();
                      } catch (Exception ignored) { }
                      os = null;
                  }
              }

              public class Bridge {
                  private final Sink contentSink = new Sink();
                  private final Sink modSink = new Sink();
                  private final Sink apkSink = new Sink();
                  private String apkName = "app.apk";
                  private final SharedPreferences prefs =
                          getSharedPreferences("gamer_bridge", Context.MODE_PRIVATE);

                  // ---------- apps / launch ----------

                  @JavascriptInterface
                  public String getApps() {
                      JSONArray arr = new JSONArray();
                      try {
                          PackageManager pm = getPackageManager();
                          Intent in = new Intent(Intent.ACTION_MAIN);
                          in.addCategory(Intent.CATEGORY_LAUNCHER);
                          List<ResolveInfo> list = pm.queryIntentActivities(in, 0);
                          Set<String> seen = new HashSet<String>();
                          for (ResolveInfo ri : list) {
                              String pkg = ri.activityInfo.packageName;
                              if (pkg.equals(getPackageName()) || !seen.add(pkg)) continue;
                              JSONObject o = new JSONObject();
                              o.put("pkg", pkg);
                              o.put("name", ri.loadLabel(pm).toString());
                              arr.put(o);
                          }
                      } catch (Exception ignored) { }
                      return arr.toString();
                  }

                  @JavascriptInterface
                  public String getIcon(String pkg) {
                      try {
                          Drawable d = getPackageManager().getApplicationIcon(pkg);
                          int sz = 96;
                          Bitmap b = Bitmap.createBitmap(sz, sz, Bitmap.Config.ARGB_8888);
                          Canvas c = new Canvas(b);
                          d.setBounds(0, 0, sz, sz);
                          d.draw(c);
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          b.compress(Bitmap.CompressFormat.PNG, 100, bo);
                          return "data:image/png;base64,"
                                  + Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public boolean launchApp(String pkg) {
                      try {
                          final Intent li = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (li == null) return false;
                          li.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ui.post(new Runnable() {
                              @Override
                              public void run() {
                                  try { startActivity(li); } catch (Exception ignored) { }
                              }
                          });
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void vibrate(int ms) {
                      try {
                          Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                          if (v == null) return;
                          if (ms < 1) ms = 20;
                          if (Build.VERSION.SDK_INT >= 26) {
                              v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                          } else {
                              v.vibrate(ms);
                          }
                      } catch (Exception ignored) { }
                  }

                  // ---------- network / files ----------

                  @JavascriptInterface
                  public String httpGet(String url) {
                      HttpURLConnection c = null;
                      try {
                          c = (HttpURLConnection) new URL(url).openConnection();
                          c.setConnectTimeout(15000);
                          c.setReadTimeout(20000);
                          c.setInstanceFollowRedirects(true);
                          c.setRequestProperty("User-Agent",
                                  "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 "
                                          + "(KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36");
                          c.setRequestProperty("Accept", "text/html,application/json,*/*");
                          int code = c.getResponseCode();
                          if (code >= 400) throw new RuntimeException("HTTP " + code);
                          InputStream is = c.getInputStream();
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] buf = new byte[16384];
                          int n;
                          while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                          is.close();
                          return bo.toString("UTF-8");
                      } catch (RuntimeException e) {
                          throw e;
                      } catch (Exception e) {
                          throw new RuntimeException(String.valueOf(e.getMessage()));
                      } finally {
                          if (c != null) c.disconnect();
                      }
                  }

                  @JavascriptInterface
                  public void downloadUrl(String url, String name) {
                      try {
                          DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                          r.setNotificationVisibility(
                                  DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,
                                  "GamerLauncher/" + safeName(name));
                          DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                          dm.enqueue(r);
                          toast("Скачивание: " + safeName(name));
                      } catch (Exception e) {
                          toast("Ошибка скачивания: " + e.getMessage());
                      }
                  }

                  @JavascriptInterface
                  public void saveSkin(String name, String b64) {
                      try {
                          saveToDownloads(name, Base64.decode(b64, Base64.DEFAULT), "image/png");
                      } catch (Exception e) {
                          toast("Не удалось сохранить скин: " + e.getMessage());
                      }
                  }

                  // ---------- import content / mods ----------

                  @JavascriptInterface
                  public void importContentBegin(String type, String name, double size) {
                      try {
                          contentSink.open(new File(baseDir(), "content/" + safeName(type) + "/" + safeName(name)));
                      } catch (Exception e) {
                          toast("Ошибка импорта: " + e.getMessage());
                      }
                  }

                  @JavascriptInterface
                  public void importContentChunk(String b64) {
                      try { contentSink.write(b64); } catch (Exception ignored) { }
                  }

                  @JavascriptInterface
                  public void importContentEnd() {
                      contentSink.close();
                  }

                  @JavascriptInterface
                  public void importContent(String type, String name, String dataUrl) {
                      try {
                          contentSink.open(new File(baseDir(), "content/" + safeName(type) + "/" + safeName(name)));
                          contentSink.os.write(decodeDataUrl(dataUrl));
                      } catch (Exception e) {
                          toast("Ошибка импорта: " + e.getMessage());
                      } finally {
                          contentSink.close();
                      }
                  }

                  @JavascriptInterface
                  public void importModBegin(String name, double size) {
                      try {
                          modSink.open(new File(baseDir(), "mods/" + safeName(name)));
                      } catch (Exception e) {
                          toast("Ошибка импорта мода: " + e.getMessage());
                      }
                  }

                  @JavascriptInterface
                  public void importModChunk(String b64) {
                      try { modSink.write(b64); } catch (Exception ignored) { }
                  }

                  @JavascriptInterface
                  public void importModEnd() {
                      modSink.close();
                  }

                  @JavascriptInterface
                  public void importMod(String name, String dataUrl) {
                      try {
                          modSink.open(new File(baseDir(), "mods/" + safeName(name)));
                          modSink.os.write(decodeDataUrl(dataUrl));
                      } catch (Exception e) {
                          toast("Ошибка импорта мода: " + e.getMessage());
                      } finally {
                          modSink.close();
                      }
                  }

                  @JavascriptInterface
                  public void deleteContent(String id) {
                      // карточки хранятся в самом лаунчере; файлы остаются в GamerLauncher/content
                  }

                  // ---------- settings the game side can read ----------

                  @JavascriptInterface
                  public void setModEnabled(String file, boolean on) {
                      prefs.edit().putBoolean("mod_on_" + file, on).apply();
                  }

                  @JavascriptInterface
                  public void setModOrder(String json) {
                      prefs.edit().putString("mod_order", json).apply();
                  }

                  @JavascriptInterface
                  public void setIsolation(String id, boolean on) {
                      prefs.edit().putBoolean("iso_" + id, on).apply();
                  }

                  @JavascriptInterface
                  public void setInbuiltMods(String json) {
                      prefs.edit().putString("inbuilt", json).apply();
                  }

                  @JavascriptInterface
                  public void prepareLaunch(String json) {
                      prefs.edit().putString("launch", json).apply();
                      try {
                          FileOutputStream os = new FileOutputStream(new File(baseDir(), "launch.json"));
                          os.write(json.getBytes("UTF-8"));
                          os.close();
                      } catch (Exception ignored) { }
                  }

                  @JavascriptInterface
                  public String getCrashReports() {
                      return "[]";
                  }

                  // ---------- APK install ----------

                  @JavascriptInterface
                  public void installApkBegin(String name, double size) {
                      try {
                          apkName = safeName(name);
                          apkSink.open(new File(new File(getCacheDir(), "apk"), apkName));
                      } catch (Exception e) {
                          toast("Ошибка APK: " + e.getMessage());
                      }
                  }

                  @JavascriptInterface
                  public void installApkChunk(String b64) {
                      try { apkSink.write(b64); } catch (Exception ignored) { }
                  }

                  @JavascriptInterface
                  public void installApkEnd() {
                      apkSink.close();
                      final File f = apkSink.file;
                      if (f == null) return;
                      ui.post(new Runnable() {
                          @Override
                          public void run() {
                              installApkFile(f);
                          }
                      });
                  }

                  // ---------- notifications / shortcuts ----------

                  @JavascriptInterface
                  public void notify(String title, String text) {
                      try {
                          NotificationManager nm =
                                  (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (Build.VERSION.SDK_INT >= 26) {
                              nm.createNotificationChannel(new NotificationChannel(
                                      CHANNEL_ID, "News", NotificationManager.IMPORTANCE_DEFAULT));
                          }
                          Intent open = new Intent(MainActivity.this, MainActivity.class);
                          PendingIntent pi = PendingIntent.getActivity(MainActivity.this, 0, open,
                                  PendingIntent.FLAG_UPDATE_CURRENT
                                          | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));
                          Notification.Builder b = Build.VERSION.SDK_INT >= 26
                                  ? new Notification.Builder(MainActivity.this, CHANNEL_ID)
                                  : new Notification.Builder(MainActivity.this);
                          b.setSmallIcon(android.R.drawable.stat_notify_chat)
                                  .setContentTitle(title == null ? "Gamer Launcher" : title)
                                  .setContentText(text == null ? "" : text)
                                  .setContentIntent(pi)
                                  .setAutoCancel(true);
                          nm.notify((int) (System.currentTimeMillis() & 0xfffffff), b.build());
                      } catch (Exception ignored) { }
                  }

                  @JavascriptInterface
                  public void createShortcut(String name, String icon, String id) {
                      if (Build.VERSION.SDK_INT < 26) {
                          toast("Ярлыки требуют Android 8+");
                          return;
                      }
                      try {
                          ShortcutManager sm = getSystemService(ShortcutManager.class);
                          if (sm == null || !sm.isRequestPinShortcutSupported()) {
                              toast("Лаунчер телефона не поддерживает ярлыки");
                              return;
                          }
                          Icon ic = null;
                          if (icon != null && icon.startsWith("data:")) {
                              byte[] raw = decodeDataUrl(icon);
                              Bitmap bm = BitmapFactory.decodeByteArray(raw, 0, raw.length);
                              if (bm != null) ic = Icon.createWithBitmap(bm);
                          }
                          if (ic == null) ic = Icon.createWithResource(MainActivity.this, R.mipmap.ic_launcher);
                          Intent i = new Intent(MainActivity.this, MainActivity.class);
                          i.setAction(Intent.ACTION_MAIN);
                          i.putExtra("inst", id);
                          ShortcutInfo info = new ShortcutInfo.Builder(MainActivity.this, "inst_" + id)
                                  .setShortLabel(name == null || name.length() == 0 ? "Minecraft" : name)
                                  .setIcon(ic)
                                  .setIntent(i)
                                  .build();
                          sm.requestPinShortcut(info, null);
                      } catch (Exception e) {
                          toast("Не удалось создать ярлык: " + e.getMessage());
                      }
                  }
              }

              private void installApkFile(File f) {
                  String lower = f.getName().toLowerCase();
                  try {
                      if (!lower.endsWith(".apk")) {
                          // .apks / .xapk нельзя поставить напрямую — кладём в Загрузки
                          java.io.FileInputStream in = new java.io.FileInputStream(f);
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] buf = new byte[65536];
                          int n;
                          while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                          in.close();
                          saveToDownloads(f.getName(), bo.toByteArray(), "application/octet-stream");
                          toast("Это не обычный APK: файл сохранён в Загрузки, установи его через SAI/файловый менеджер");
                          return;
                      }
                      if (Build.VERSION.SDK_INT >= 26 && !getPackageManager().canRequestPackageInstalls()) {
                          Intent s = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                  Uri.parse("package:" + getPackageName()));
                          startActivity(s);
                          toast("Разреши установку из этого приложения и повтори");
                          return;
                      }
                      Uri u = FileProvider.getUriForFile(this,
                              "com.gamer.launcher.fileprovider", f);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(u, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      toast("Установка не удалась: " + e.getMessage());
                  }
              }
          }
