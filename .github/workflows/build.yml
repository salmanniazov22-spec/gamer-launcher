name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android project
        run: |
          set -e
          cat > settings.gradle <<'GL_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GamerLauncher"
          include ':app'
          GL_EOF
          cat > build.gradle <<'GL_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GL_EOF
          cat > gradle.properties <<'GL_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          GL_EOF
          mkdir -p app
          cat > app/build.gradle <<'GL_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gamer.launcher'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gamer.launcher"
                  minSdk 29
                  targetSdk 34
                  versionCode 2
                  versionName "6.2"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GL_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'GL_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Gamer Launcher"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          GL_EOF
          mkdir -p app/src/main/java/com/gamer/launcher
          cat > app/src/main/java/com/gamer/launcher/MainActivity.java <<'GL_EOF'
          package com.gamer.launcher;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Message;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.OutputStream;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends Activity {

              private static final int REQ_FILE = 1001;
              private WebView web;
              private ValueCallback<Uri[]> filePathCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#02070F"));
                  setContentView(web);
                  hideSystemUi();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);

                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          String u = r.getUrl().toString();
                          if (u.startsWith("file:")) return false;
                          openExternal(u);
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              startActivityForResult(params.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          final WebView tmp = new WebView(MainActivity.this);
                          final boolean[] done = {false};
                          tmp.setWebViewClient(new WebViewClient() {
                              private void handle(WebView v, String url) {
                                  if (done[0] || url == null || url.equals("about:blank")) return;
                                  done[0] = true;
                                  openExternal(url);
                                  v.stopLoading();
                                  v.post(new Runnable() {
                                      @Override
                                      public void run() {
                                          tmp.destroy();
                                      }
                                  });
                              }

                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                                  handle(v, r.getUrl().toString());
                                  return true;
                              }

                              @Override
                              public void onPageStarted(WebView v, String url, Bitmap favicon) {
                                  handle(v, url);
                              }
                          });
                          WebView.WebViewTransport t = (WebView.WebViewTransport) resultMsg.obj;
                          t.setWebView(tmp);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  web.setDownloadListener(new android.webkit.DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String ua, String cd, String mime, long len) {
                          enqueueDownload(url, URLUtil.guessFileName(url, cd, mime), mime);
                      }
                  });

                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_FILE) {
                      if (filePathCallback != null) {
                          filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                          filePathCallback = null;
                      }
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              private void openExternal(String url) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      toast("Не удалось открыть ссылку");
                  }
              }

              private void enqueueDownload(String url, String name, String mime) {
                  try {
                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                      if (mime != null && !mime.isEmpty()) req.setMimeType(mime);
                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      dm.enqueue(req);
                      toast("Скачивание: " + name);
                  } catch (Exception e) {
                      toast("Ошибка скачивания: " + e.getMessage());
                  }
              }

              private void toast(final String msg) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show();
                      }
                  });
              }

              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemUi();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              public class Bridge {
                  @JavascriptInterface
                  public void saveSkin(String name, String base64) {
                      try {
                          String safe = name.replaceAll("[^\\w.\\-]", "_");
                          byte[] data = Base64.decode(base64, Base64.DEFAULT);
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, safe);
                          v.put(MediaStore.Downloads.MIME_TYPE, "image/png");
                          v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/GamerLauncher");
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          OutputStream os = getContentResolver().openOutputStream(uri);
                          os.write(data);
                          os.close();
                          toast("Скин сохранён: Загрузки/GamerLauncher/" + safe);
                      } catch (Exception e) {
                          toast("Не удалось сохранить скин: " + e.getMessage());
                      }
                  }

                  @JavascriptInterface
                  public void downloadUrl(String url, String name) {
                      enqueueDownload(url, name.replaceAll("[^\\w.\\-]", "_"), "image/png");
                  }

                  @JavascriptInterface
                  public String getApps() {
                      try {
                          PackageManager pm = getPackageManager();
                          Intent q = new Intent(Intent.ACTION_MAIN);
                          q.addCategory(Intent.CATEGORY_LAUNCHER);
                          List<ResolveInfo> list = pm.queryIntentActivities(q, 0);
                          JSONArray arr = new JSONArray();
                          Set<String> seen = new HashSet<String>();
                          for (ResolveInfo ri : list) {
                              String pkg = ri.activityInfo.packageName;
                              if (pkg.equals(getPackageName()) || !seen.add(pkg)) continue;
                              JSONObject o = new JSONObject();
                              o.put("pkg", pkg);
                              o.put("name", ri.loadLabel(pm).toString());
                              arr.put(o);
                          }
                          return arr.toString();
                      } catch (Exception e) {
                          return "[]";
                      }
                  }

                  @JavascriptInterface
                  public String getIcon(String pkg) {
                      try {
                          Drawable d = getPackageManager().getApplicationIcon(pkg);
                          Bitmap b = Bitmap.createBitmap(64, 64, Bitmap.Config.ARGB_8888);
                          Canvas c = new Canvas(b);
                          d.setBounds(0, 0, 64, 64);
                          d.draw(c);
                          ByteArrayOutputStream bos = new ByteArrayOutputStream();
                          b.compress(Bitmap.CompressFormat.PNG, 100, bos);
                          return "data:image/png;base64," + Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP);
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public boolean launchApp(String pkg) {
                      try {
                          Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (i == null) return false;
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }
              }
          }
          GL_EOF
          mkdir -p app/src/main/res/drawable
          cat > /tmp/ic.xml <<'GL_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0A1022" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#8AFFFF" android:pathData="M54,22 L84,38 L54,54 L24,38 Z" />
              <path android:fillColor="#4FC3C3" android:pathData="M24,38 L54,54 L54,88 L24,72 Z" />
              <path android:fillColor="#8AFF8A" android:pathData="M84,38 L54,54 L54,88 L84,72 Z" />
          </vector>
          GL_EOF
          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/drawable/ic_launcher.png
          elif ls app/src/main/res/mipmap-*/ic_launcher.png >/dev/null 2>&1; then
            sed -i 's#@drawable/ic_launcher#@mipmap/ic_launcher#' app/src/main/AndroidManifest.xml
          else
            cp /tmp/ic.xml app/src/main/res/drawable/ic_launcher.xml
          fi
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GamerLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
